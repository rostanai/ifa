name: Incident-to-Fix

# Runs when the workflow named "CI" fails. Rename "CI" to match your pipeline.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  fix:
    # Same-repo runs only (fork code must never see our secrets), and never react to our own fix branches.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'fix/')
    runs-on: ubuntu-latest
    steps:
      # Trusted agent code comes from the default branch, so a pushed branch cannot swap in its own agent.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      # Code under test: no stored credentials; full history for git blame.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: code
          fetch-depth: 0
          persist-credentials: false

      - name: Download the failed log
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --log-failed > ci.log

      # Only this step sees the model keys. The agent strips KEY/TOKEN/SECRET vars before running your tests.
      - name: Fix and verify
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NEBIUS_MODEL: ${{ vars.NEBIUS_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TEST_CMD: ${{ vars.TEST_CMD }}
        run: |
          : "${TEST_CMD:?set the TEST_CMD repo variable, the agent must verify before committing}"
          : "${NEBIUS_API_KEY:?set the NEBIUS_API_KEY repo secret}"
          git -C code config user.name "incident-to-fix[bot]"
          git -C code config user.email "incident-to-fix@users.noreply.github.com"
          python3 trusted/agent.py code ci.log --test "$TEST_CMD"

      # Runs only if the fix verified. The PR is for a human to review; nothing is merged automatically.
      - name: Push branch and open PR
        working-directory: code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="$(git branch --show-current)"
          gh auth setup-git
          git push -u origin "$BRANCH"
          gh pr create --fill --head "$BRANCH"
